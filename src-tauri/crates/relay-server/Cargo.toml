[package]
name = "mashiro-together-server"
description = "Сервер-релей режима «слушать вместе» (встроен во Flowly)"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "relay"
path = "src/lib.rs"

[dependencies]
mashiro-together-crypto = { path = "../together-crypto" }
axum = { version = "0.7", features = ["ws"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
