<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowly — Multi-Streaming Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=JetBrains+Mono:wght@800&family=Oswald:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Russo+One&family=Unbounded:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0e;
        color: #f5f5f7;
        overflow: hidden;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      #flowly-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at 50% 45%, rgba(255, 59, 92, 0.16), #0b0b0e 65%), #0b0b0e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        transition: opacity 0.42s ease, transform 0.42s ease;
      }

      #flowly-splash.hide {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }

      .splash-ring {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: rgba(255, 59, 92, 0.12);
        border: 1px solid rgba(255, 59, 92, 0.35);
        display: grid;
        place-items: center;
        box-shadow: 0 0 40px rgba(255, 59, 92, 0.25);
        animation: splash-pulse 1.8s ease-in-out infinite alternate;
      }

      .splash-wave {
        stroke-dasharray: 28;
        stroke-dashoffset: 28;
        animation: splash-draw 1.4s ease-in-out infinite alternate;
      }

      .splash-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f5f5f7;
      }

      .splash-sub {
        font-size: 11px;
        color: #7c7c8c;
      }

      @keyframes splash-pulse {
        from { transform: scale(0.96); box-shadow: 0 0 24px rgba(255, 59, 92, 0.18); }
        to { transform: scale(1.04); box-shadow: 0 0 48px rgba(255, 59, 92, 0.38); }
      }

      @keyframes splash-draw {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="flowly-splash">
      <div class="splash-ring">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <path
            class="splash-wave"
            d="M6.5 14.5C8.2 9.5 10.2 9.5 12 12C13.8 14.5 15.8 14.5 17.5 9.5"
            stroke="#ff3b5c"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="17.5" cy="9.5" r="1.5" fill="#f5f5f7" />
        </svg>
      </div>
      <div class="splash-title">Flowly</div>
      <div class="splash-sub">Подключаем медиатеку...</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
