name: Release Flowly

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Flowly v__VERSION__'
          releaseBody: |
            - Полностью переработаны настройки: появились отдельные вкладки «Оформление», «Звук», «Профиль» и «О программе»
            - Добавлены визуальные мини-превью для тем оформления, а динамическая тема перенесена в «Оформление»
            - В разделе «Звук» появился выбор устройства вывода (наушники, колонки), настройка плавных переходов и радиоведущий
            - Диктора радио теперь слышно намного лучше: увеличена громкость голоса и усилено приглушение музыки во время речи
            - Добавлена автоматическая проверка обновлений при запуске со списком изменений и окно «Что нового» после обновления
            - Исправлена кнопка «Войти в сервис» (теперь открывает вход в сервисы, а не профиль) и убран Spotify
          releaseDraft: false
          prerelease: false
