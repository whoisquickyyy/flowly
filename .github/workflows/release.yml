name: Release Flowly

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Flowly v__VERSION__'
          releaseBody: |
            - Авторизация SoundCloud переведена на OAuth 2.1 (PKCE) через системный браузер (`tauri-plugin-opener`) и Cloudflare Worker — работает из коробки без прокси и VPN
            - Карточка артиста в стиле Яндекс Музыки: Hero-баннер, альбомы, синглы/EP, популярные треки и похожие артисты
            - На главном экране под «Моей волной» добавлен быстрый блок «Медиатека» для запуска случайного трека из коллекции
            - Исправлены Jam-комнаты (общие/приватные комнаты, открытое лобби, управление только у хоста, пересборка микса, повторный вход)
            - Улучшен алгоритм Spatial 3D Audio (Mid-Side + бинауральная комната), исправлена тишина после перемотки в конец трека и добавлен Ambient Light в «Живую типографику»
            - Ускорен холодный старт последнего трека (фоновый прогрев URL)
          releaseDraft: false
          prerelease: false
